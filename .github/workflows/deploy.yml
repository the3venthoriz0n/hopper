name: Build and Deploy

on:
  push:
    branches: [main]
    # Triggers dev deployment on every push to main
  release:
    types: [created]
    # Triggers prod deployment when a release is created
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      skip_tests:
        description: 'Skip running tests'
        required: false
        default: true
        type: boolean

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    # Skip tests for dev pushes (fast deploy) and when skip_tests is true
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests != true) }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: hopper-backend-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was built
        run: |
          echo "🔍 Verifying test image exists..."
          docker images | grep hopper-backend-test || (echo "❌ Image not found!" && exit 1)
          echo "✅ Image verified!"

      - name: Run backend test suite
        run: |
          echo "🧪 Running backend test suite..."
          TEST_ENCRYPTION_KEY=$(docker run --rm hopper-backend-test:latest python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run --rm \
            -e ENCRYPTION_KEY="$TEST_ENCRYPTION_KEY" \
            -e ENVIRONMENT=test \
            -e DATABASE_URL=sqlite:///:memory: \
            -e LOG_LEVEL=INFO \
            hopper-backend-test:latest \
            python -m pytest /app/tests/ -v --tb=short -m "not skip"
          echo "✅ Backend test suite passed!"

      - name: Build frontend image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: dev
          push: false
          load: true
          tags: hopper-frontend-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_VERSION=test

      - name: Verify frontend image was built
        run: |
          echo "🔍 Verifying frontend test image exists..."
          docker images | grep hopper-frontend-test || (echo "❌ Image not found!" && exit 1)
          echo "✅ Image verified!"

      - name: Run frontend test suite
        run: |
          echo "🧪 Running frontend test suite..."
          docker run --rm \
            -e CI=true \
            hopper-frontend-test:latest \
            npm test
          echo "✅ Frontend test suite passed!"

      - name: Start services for integration tests
        if: github.event_name == 'release'
        run: |
          echo "🚀 Starting services for integration tests..."
          docker network create hopper_test_network || true

          docker run -d --name test-postgres \
            --network hopper_test_network \
            -e POSTGRES_DB=hopper \
            -e POSTGRES_USER=hopper \
            -e POSTGRES_PASSWORD=test_password \
            postgres:16-alpine

          docker run -d --name test-redis \
            --network hopper_test_network \
            redis:7-alpine

          echo "⏳ Waiting for services to start..."
          sleep 5

          until docker exec test-postgres pg_isready -U hopper; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          until docker exec test-redis redis-cli ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Start backend for integration tests
        if: github.event_name == 'release'
        run: |
          echo "🚀 Starting backend for integration tests..."
          TEST_ENCRYPTION_KEY=$(docker run --rm hopper-backend-test:latest python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run -d --name test-backend \
            --network hopper_test_network \
            -e DATABASE_URL=postgresql://hopper:test_password@test-postgres:5432/hopper \
            -e REDIS_URL=redis://test-redis:6379/0 \
            -e ENVIRONMENT=test \
            -e ENCRYPTION_KEY="$TEST_ENCRYPTION_KEY" \
            -e LOG_LEVEL=INFO \
            hopper-backend-test:latest

          echo "⏳ Waiting for backend to start..."
          for i in {1..30}; do
            if docker exec test-backend curl -f http://localhost:8000/health >/dev/null 2>&1 || \
               docker exec test-backend wget -q --spider http://localhost:8000/health >/dev/null 2>&1; then
              echo "✅ Backend is ready!"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' test-backend 2>/dev/null)" = "true" ]; then
              if [ $i -ge 10 ]; then
                echo "⚠️  Backend container is running but health endpoint not responding (may be starting)"
                break
              fi
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        if: github.event_name == 'release'
        run: |
          echo "🔒 Running integration tests..."
          TEST_ENCRYPTION_KEY=$(docker run --rm hopper-backend-test:latest python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run --rm \
            --network hopper_test_network \
            -e ENCRYPTION_KEY="$TEST_ENCRYPTION_KEY" \
            -e RUN_INTEGRATION_TESTS=true \
            -e TEST_BASE_URL=http://test-backend:8000 \
            -e TEST_FRONTEND_ORIGIN=http://localhost:3000 \
            hopper-backend-test:latest \
            python -m pytest /app/tests/test_integration.py -v
          echo "✅ Integration tests passed!"

      - name: Cleanup test services
        if: always() && github.event_name == 'release'
        run: |
          echo "🧹 Cleaning up test services..."
          docker stop test-backend test-postgres test-redis 2>/dev/null || true
          docker rm test-backend test-postgres test-redis 2>/dev/null || true
          docker network rm hopper_test_network 2>/dev/null || true

  # Determine target environment
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Generate tag
        id: tag
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "tag=${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: [test, set-environment]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.set-environment.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.environment }}
    permissions:
      contents: read
      packages: write

    outputs:
      env: ${{ needs.set-environment.outputs.environment }}
      tag: ${{ needs.set-environment.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-backend:${{ needs.set-environment.outputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-backend:${{ needs.set-environment.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.BACKEND_URL }}
            REACT_APP_DOMAIN=${{ secrets.DOMAIN }}
            REACT_APP_FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            REACT_APP_ENVIRONMENT=${{ needs.set-environment.outputs.environment == 'prod' && 'production' || 'development' }}
            REACT_APP_VERSION=${{ needs.set-environment.outputs.tag }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-frontend:${{ needs.set-environment.outputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-frontend:${{ needs.set-environment.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push otel-collector
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring
          file: ./monitoring/Dockerfile.otel.${{ needs.set-environment.outputs.environment }}
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-otel:${{ needs.set-environment.outputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-otel:${{ needs.set-environment.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push prometheus
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring
          file: ./monitoring/Dockerfile.prometheus
          push: true
          build-args: |
            ENV=${{ needs.set-environment.outputs.environment }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-prometheus:${{ needs.set-environment.outputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-prometheus:${{ needs.set-environment.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push loki
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring
          file: ./monitoring/Dockerfile.loki.${{ needs.set-environment.outputs.environment }}
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-loki:${{ needs.set-environment.outputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-loki:${{ needs.set-environment.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push grafana
        uses: docker/build-push-action@v6
        with:
          context: ./monitoring
          file: ./monitoring/Dockerfile.grafana
          push: true
          build-args: |
            ENV=${{ needs.set-environment.outputs.environment }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-grafana:${{ needs.set-environment.outputs.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hopper-grafana:${{ needs.set-environment.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, set-environment, build-and-push]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set deployment variables
        id: vars
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          TAG="${{ needs.set-environment.outputs.tag }}"

          echo "app_dir=${{ secrets.APP_DIR }}" >> $GITHUB_OUTPUT
          echo "short_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Connect to Tailscale
        if: needs.set-environment.outputs.environment == 'dev'
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          args: --accept-routes
          tags: tag:ci

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -l -f ~/.ssh/deploy_key || {
            echo "❌ Invalid SSH key format!"
            exit 1
          }

          echo "✅ SSH key configured successfully"

      - name: Create environment file
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          TAG="${{ needs.set-environment.outputs.tag }}"

          cat > .env.$ENV << EOF
          ENVIRONMENT=${{ needs.set-environment.outputs.environment == 'prod' && 'production' || 'development' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL }}
          DOMAIN=${{ secrets.DOMAIN }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          CLOUDFLARE_ACCESS_AUD_TAG=${{ secrets.CLOUDFLARE_ACCESS_AUD_TAG }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN=${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PROJECT_ID=${{ secrets.GOOGLE_PROJECT_ID }}
          TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}
          INSTAGRAM_APP_ID=${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET=${{ secrets.INSTAGRAM_APP_SECRET }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICING_TABLE_ID=${{ secrets.STRIPE_PRICING_TABLE_ID }}
          STRIPE_API_VERSION=${{ secrets.STRIPE_API_VERSION }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL=${{ secrets.R2_ENDPOINT_URL }}
          R2_PUBLIC_DOMAIN=${{ secrets.R2_PUBLIC_DOMAIN }}
          R2_VALIDATE_CUSTOM_DOMAIN_URLS=${{ secrets.R2_VALIDATE_CUSTOM_DOMAIN_URLS }}
          R2_URL_VALIDATION_TIMEOUT=${{ secrets.R2_URL_VALIDATION_TIMEOUT }}
          GITHUB_REPOSITORY=${{ github.repository }}
          TAG=$TAG
          GHCR_IMAGE_BACKEND=ghcr.io/${{ github.repository }}/hopper-backend:${TAG}
          GHCR_IMAGE_FRONTEND=ghcr.io/${{ github.repository }}/hopper-frontend:${TAG}
          GHCR_IMAGE_OTEL=ghcr.io/${{ github.repository }}/hopper-otel:${TAG}
          GHCR_IMAGE_PROMETHEUS=ghcr.io/${{ github.repository }}/hopper-prometheus:${TAG}
          GHCR_IMAGE_LOKI=ghcr.io/${{ github.repository }}/hopper-loki:${TAG}
          GHCR_IMAGE_GRAFANA=ghcr.io/${{ github.repository }}/hopper-grafana:${TAG}
          EOF

          chmod 600 .env.$ENV

      - name: Deploy to server
        env:
          SSH_OPTS: "-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes"
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ENV: ${{ needs.set-environment.outputs.environment }}
          SHORT_TAG: ${{ steps.vars.outputs.short_tag }}
        run: |
          echo "🚀 Deploying $ENV environment (tag: $SHORT_TAG) to $SSH_USER@$SSH_HOST"

          # Test SSH connection
          echo "🔍 Testing SSH connection..."
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "echo '✅ SSH connection successful'" || {
            echo "❌ SSH connection failed!"
            exit 1
          }

          # Create directories
          echo "📁 Creating directories..."
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "mkdir -p $APP_DIR/nginx $APP_DIR/scripts"

          # Deploy secrets file
          echo "🔐 Deploying secrets..."
          scp $SSH_OPTS .env.$ENV $SSH_USER@$SSH_HOST:/tmp/.env.$ENV.$$
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "
            sudo mv /tmp/.env.$ENV.$$ $APP_DIR/.env.$ENV && \
            sudo chmod 600 $APP_DIR/.env.$ENV
          "
          rm .env.$ENV

          # Copy application files
          echo "📦 Copying application files..."
          scp $SSH_OPTS docker-compose.$ENV.yml $SSH_USER@$SSH_HOST:$APP_DIR/
          scp $SSH_OPTS scripts/deploy.sh $SSH_USER@$SSH_HOST:$APP_DIR/
          scp $SSH_OPTS makefile $SSH_USER@$SSH_HOST:$APP_DIR/

          # Copy scripts
          echo "📦 Copying scripts..."
          scp $SSH_OPTS scripts/backup-db.sh $SSH_USER@$SSH_HOST:$APP_DIR/scripts/
          scp $SSH_OPTS scripts/restore-db.sh $SSH_USER@$SSH_HOST:$APP_DIR/scripts/

          # Copy nginx config (environment-specific)
          if [ "$ENV" == "prod" ]; then
            scp $SSH_OPTS nginx/prod-hopper.conf $SSH_USER@$SSH_HOST:$APP_DIR/nginx/
          else
            scp $SSH_OPTS nginx/dev-hopper.conf $SSH_USER@$SSH_HOST:$APP_DIR/nginx/
          fi

          # Deploy SSL certificates (prod only)
          if [ "$ENV" == "prod" ]; then
            echo "🔒 Deploying SSL certificates..."
            scp $SSH_OPTS scripts/deploy-ssl-certs.sh $SSH_USER@$SSH_HOST:$APP_DIR/scripts/
            if [ -n "${{ secrets.SSL_CERT }}" ] && [ -n "${{ secrets.SSL_KEY }}" ]; then
              TEMP_DIR=$(mktemp -d)
              chmod 700 "$TEMP_DIR"
              echo "${{ secrets.SSL_CERT }}" > "$TEMP_DIR/ssl_cert.pem"
              echo "${{ secrets.SSL_KEY }}" > "$TEMP_DIR/ssl_key.pem"
              chmod 600 "$TEMP_DIR/ssl_cert.pem" "$TEMP_DIR/ssl_key.pem"

              SERVER_TEMP=$(ssh $SSH_OPTS $SSH_USER@$SSH_HOST "mktemp -d" | tr -d '\r\n')
              scp $SSH_OPTS "$TEMP_DIR/ssl_cert.pem" $SSH_USER@$SSH_HOST:"$SERVER_TEMP/ssl_cert.pem"
              scp $SSH_OPTS "$TEMP_DIR/ssl_key.pem" $SSH_USER@$SSH_HOST:"$SERVER_TEMP/ssl_key.pem"
              rm -rf "$TEMP_DIR"

              ssh $SSH_OPTS $SSH_USER@$SSH_HOST "
                chmod 600 $SERVER_TEMP/ssl_cert.pem $SERVER_TEMP/ssl_key.pem && \
                cd $APP_DIR && \
                chmod +x scripts/deploy-ssl-certs.sh && \
                export PROD_SSL_CERT=\$(cat $SERVER_TEMP/ssl_cert.pem) && \
                export PROD_SSL_KEY=\$(cat $SERVER_TEMP/ssl_key.pem) && \
                rm -rf $SERVER_TEMP && \
                sudo -E ./scripts/deploy-ssl-certs.sh $ENV
              " || {
                echo "⚠️  SSL certificate deployment failed, continuing..."
                ssh $SSH_OPTS $SSH_USER@$SSH_HOST "rm -rf $SERVER_TEMP" 2>/dev/null || true
              }
            else
              echo "⚠️  SSL certificates not configured, skipping"
            fi
          fi

          # Run deployment
          echo "🚀 Running deployment script..."
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "
            cd $APP_DIR && \
            chmod +x deploy.sh && \
            source .env.$ENV && \
            ./deploy.sh $ENV $SHORT_TAG
          "

          echo "✅ Deployment completed successfully!"

      - name: Cleanup on failure
        if: failure()
        env:
          SSH_OPTS: "-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes"
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ENV: ${{ needs.set-environment.outputs.environment }}
        run: |
          echo "🧹 Cleaning up after failed deployment..."
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "rm -f $APP_DIR/.env.$ENV" 2>/dev/null || true
          rm -f ~/.ssh/deploy_key
