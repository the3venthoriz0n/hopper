services:
  nginx:
    image: nginx:alpine
    container_name: dev-hopper-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev-hopper.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - hopper_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dev-hopper-postgres
    environment:
      - POSTGRES_DB=hopper
      - POSTGRES_USER=hopper
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hopper_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - hopper_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: dev-hopper-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - hopper_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${GHCR_IMAGE_BACKEND:-ghcr.io/the3venthoriz0n/hopper/hopper-backend:dev-latest}
    container_name: dev-hopper-backend
    pull_policy: always
    ports:
      - "8000:8000"
    volumes:
      - backend_sessions:/app/sessions
    depends_on:
      - postgres
      - redis
      - otel-collector
    env_file:
      - .env.dev
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://hopper:${POSTGRES_PASSWORD:-hopper_dev_password}@dev-hopper-postgres:5432/hopper
      - REDIS_URL=redis://dev-hopper-redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://dev-hopper-otel-collector:4317
      - OTEL_SERVICE_NAME=hopper-backend
      - OTEL_RESOURCE_ATTRIBUTES=service.name=hopper-backend,service.version=1.0.0,deployment.environment=${ENVIRONMENT:-development}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - hopper_default

  frontend:
    image: ${GHCR_IMAGE_FRONTEND:-ghcr.io/the3venthoriz0n/hopper/hopper-frontend:dev-latest}
    container_name: dev-hopper-frontend
    pull_policy: always
    expose:
      - "80"
    depends_on:
      - backend
    environment:
      - REACT_APP_BACKEND_URL=${BACKEND_URL}
      - REACT_APP_DOMAIN=${DOMAIN}
      - REACT_APP_FRONTEND_URL=${FRONTEND_URL}
      - REACT_APP_ENVIRONMENT=development
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - hopper_default

  otel-collector:
    image: ${GHCR_IMAGE_OTEL:-ghcr.io/the3venthoriz0n/hopper/hopper-otel:dev-latest}
    container_name: dev-hopper-otel-collector
    pull_policy: always
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      - loki
    networks:
      - hopper_default

  prometheus:
    image: ${GHCR_IMAGE_PROMETHEUS:-ghcr.io/the3venthoriz0n/hopper/hopper-prometheus:dev-latest}
    container_name: dev-hopper-prometheus
    pull_policy: always
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - backend
    networks:
      - hopper_default

  loki:
    image: ${GHCR_IMAGE_LOKI:-ghcr.io/the3venthoriz0n/hopper/hopper-loki:dev-latest}
    container_name: dev-hopper-loki
    pull_policy: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - hopper_default

  grafana:
    image: ${GHCR_IMAGE_GRAFANA:-ghcr.io/the3venthoriz0n/hopper/hopper-grafana:dev-latest}
    container_name: dev-hopper-grafana
    pull_policy: always
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3011:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=
      - GF_DASHBOARDS_ALLOW_EDIT=true
      - GF_DASHBOARDS_VERSION_HISTORY_SIZE=20
    depends_on:
      - prometheus
      - loki
    networks:
      - hopper_default

networks:
  hopper_default:
    name: hopper_default
    external: true

volumes:
  postgres_data:
  redis_data:
  backend_sessions:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_cache:
